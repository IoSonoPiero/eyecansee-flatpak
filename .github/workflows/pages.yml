# Publishes the latest release's eyecansee-flatpak-repo.tar (signed on the developer's PC by
# tools/sign-flatpak.sh of IoSonoPiero/eyecansee): repo/ (OSTree) and media/ (icons and screenshots
# AppStream points to), with site/ at the root.
name: pages
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release to publish (empty = the latest)
        required: false

# A deploy made from the release's tag succeeds but the site keeps the previous version (#1):
# Pages serves only deploys from main. So the release only starts this workflow again on main.
# After a deploy, the version online is in repo/refs/heads/app/io.github.IoSonoPiero.EyeCanSee/x86_64/master
# (the commit of the app); it should change within a minute.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  relaunch:
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Deploy again from main, with this release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh workflow run pages --repo "$GITHUB_REPOSITORY" --ref main -f tag="$TAG"

  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Repository of the latest release, checked
        env:
          GH_TOKEN: ${{ github.token }}
          # The release passed by the relaunch job; empty when run by hand (then the latest). Asking
          # for "the latest" right after publishing could still get the previous one (0.75.0, 2026-11-09).
          TAG: ${{ inputs.tag }}
        run: |
          F=eyecansee-flatpak-repo.tar
          cp -r site _site
          # Before the first release only the page is published (run by hand).
          if gh release view $TAG --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download $TAG --repo "$GITHUB_REPOSITORY" --pattern "$F"
            WANT=$(gh release view $TAG --repo "$GITHUB_REPOSITORY" --json body --jq .body | grep -oP "^SHA-256 of \Q$F\E: \`\K[0-9a-f]{64}")
            echo "$WANT  $F" | sha256sum -c
            tar -C _site -xf "$F"  # repo/ and media/
          else
            echo "::notice::no published release yet: the page only"
          fi
          du -sh _site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
